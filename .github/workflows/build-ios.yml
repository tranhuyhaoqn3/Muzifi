name: Build iOS IPA

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main, master ]
    paths:
      - 'ios-app/**'
      - 'web/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Root Dependencies & Build Web Client
        run: |
          npm ci || npm install
          npm run build

      - name: Sync iOS Capacitor Assets
        working-directory: ios-app
        run: |
          npm ci || npm install
          rm -rf www
          mkdir -p www
          cp -r ../dist/* www/
          npx cap sync ios

      - name: Build Xcode Archive (Clean & No Code Signing Needed)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild clean \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../../../build/Muzifi.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App into IPA File
        run: |
          mkdir -p Payload
          cp -r build/Muzifi.xcarchive/Products/Applications/App.app Payload/Muzifi.app
          zip -r Muzifi.ipa Payload
          ls -lh Muzifi.ipa

      - name: Upload Muzifi.ipa as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muzifi-iOS-IPA
          path: Muzifi.ipa
          retention-days: 14
